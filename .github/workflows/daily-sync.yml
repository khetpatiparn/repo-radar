name: Daily Trending Sync

on:
  schedule:
    - cron: '15 0 * * *' # Run daily at 00:15 UTC (07:15 AM ICT / เวลาไทย เลี่ยงช่วงคิวชนตอนต้นชั่วโมง)
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Data Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run pipeline

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code src/data/ || echo "changes_exist=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes_exist == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/repos.json src/data/papers.json
          git commit -m "chore(data): sync daily trending repos and AI research papers [skip ci]"
          git pull --rebase origin main
          git push origin main

