name: Daily Trending Sync

on:
  schedule:
    # ตั้งเวลาหนีช่วงรถติดเที่ยงคืน UTC (23:30–00:30 UTC ที่ GitHub Actions มักดีเลย์ 4-5 ชม.)
    # รอบหลักเริ่มก่อนเที่ยงคืน UTC 2.5 ชม. เพื่อให้ซิงก์เสร็จ + ส่ง Telegram ทันช่วงเช้าเวลาไทย (05:00-07:30 น.)
    # มีรอบสำรองเผื่อ GitHub ทิ้งคิว โดยรอบสำรองจะข้ามเองถ้าวันนี้ซิงก์และส่งแจ้งเตือนไปแล้ว
    - cron: '19 21 * * *' # รอบหลัก   04:19 น. เวลาไทย (21:19 UTC — คิวโล่งก่อนเที่ยงคืน UTC)
    - cron: '43 22 * * *' # รอบสำรอง 1 05:43 น. เวลาไทย (22:43 UTC)
    - cron: '19 0 * * *'  # รอบสำรอง 2 07:19 น. เวลาไทย (00:19 UTC)
  workflow_dispatch: # กดรันเองได้เสมอ (บังคับซิงก์ หรือ refresh บทความล่าสุดเป็นรูปแบบ 3-Pass)
    inputs:
      refresh_latest:
        description: 'Re-generate today papers, today repos, and latest 10 news with 3-Pass deep reading (skips duplicate Telegram alert)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Skip if already synced today (Asia/Bangkok)
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run -> always sync"
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          TODAY=$(TZ=Asia/Bangkok date +%F)
          LAST_SYNC_DATE=$(node -e '
            const fs = require("fs");
            try {
              const s = JSON.parse(fs.readFileSync("src/data/sync-status.json", "utf8"));
              console.log(s.last_sync_date_ict || "none");
            } catch {
              console.log("none");
            }
          ')
          echo "Today (ICT): $TODAY | Last sync-status.json date (ICT): $LAST_SYNC_DATE"
          if [ "$LAST_SYNC_DATE" = "$TODAY" ]; then
            echo "Already synced today (ICT) -> skipping backup schedule slot."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci --legacy-peer-deps

      - name: Run Data Pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}
          REFRESH_LATEST: ${{ github.event.inputs.refresh_latest == 'true' && 'true' || 'false' }}
        run: |
          if [ "$REFRESH_LATEST" = "true" ]; then
            npm run pipeline:refresh
          else
            npm run pipeline
          fi

      - name: Check for changes
        if: steps.guard.outputs.skip != 'true'
        id: git-check
        run: |
          git diff --exit-code src/data/ || echo "changes_exist=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.guard.outputs.skip != 'true' && steps.git-check.outputs.changes_exist == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/repos.json src/data/papers.json src/data/news.json src/data/sync-status.json
          # ห้ามใส่ [skip ci] เพราะ Vercel จะข้ามการ deploy commit นั้น
          git commit -m "chore(data): sync daily trending repos, AI papers, and lab news"
          # main อาจมี commit ใหม่ระหว่างที่ pipeline รัน (~8-10 นาที) -> rebase ก่อน push
          # -X theirs = ถ้าไฟล์ data ชนกัน ให้ใช้ข้อมูลชุดใหม่ของบอท
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep 5
          done
          exit 1
