<!DOCTYPE html><html lang="th" class="bg-zinc-950 text-zinc-100"><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script><title>SureVault Simulator</title></head><body class="p-4 md:p-8 max-w-4xl mx-auto"><header class="flex justify-between items-center mb-8"><h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">SureVault Simulator</h1><a href="https://github.com/we-promise/sure" target="_blank" class="text-xs bg-zinc-800 px-3 py-1 rounded-full hover:bg-zinc-700">GitHub: we-promise/sure</a></header><div class="grid md:grid-cols-2 gap-8"><div class="space-y-4"><h2 class="text-sm uppercase text-zinc-400">ตั้งค่าสถานะทางการเงิน</h2><div class="flex gap-2"><button onclick="loadPreset(1)" class="bg-zinc-800 text-xs px-3 py-1 rounded hover:bg-emerald-900">ลองข้อมูลตัวอย่าง 1</button><button onclick="loadPreset(2)" class="bg-zinc-800 text-xs px-3 py-1 rounded hover:bg-emerald-900">ตัวอย่าง 2</button></div><div><label class="block text-xs mb-1">รายได้ต่อเดือน (บาท)</label><input type="number" id="income" class="w-full bg-zinc-900 border border-zinc-700 p-2 rounded" value="30000"></div><div><label class="block text-xs mb-1">ค่าใช้จ่ายต่อเดือน (บาท)</label><input type="number" id="expenses" class="w-full bg-zinc-900 border border-zinc-700 p-2 rounded" value="20000"></div><div><label class="block text-xs mb-1">สินทรัพย์สะสม (บาท)</label><input type="number" id="assets" class="w-full bg-zinc-900 border border-zinc-700 p-2 rounded" value="100000"></div><button onclick="calculate()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded font-bold">คำนวณอิสรภาพทางการเงิน</button></div><div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800"><div id="results" class="space-y-4"><p class="text-zinc-500">กรอกข้อมูลเพื่อดูผลลัพธ์...</p></div><button id="copyBtn" onclick="copyResult()" class="hidden mt-6 w-full text-xs border border-zinc-700 py-2 rounded hover:bg-zinc-800">คัดลอกผลลัพธ์</button></div></div><script>function loadPreset(id){if(id===1){document.getElementById('income').value=50000;document.getElementById('expenses').value=30000;document.getElementById('assets').value=500000;}else{document.getElementById('income').value=100000;document.getElementById('expenses').value=90000;document.getElementById('assets').value=1000000;}}function calculate(){const inc=parseFloat(document.getElementById('income').value);const exp=parseFloat(document.getElementById('expenses').value);const assets=parseFloat(document.getElementById('assets').value);const net=inc-exp;const yearsToFire=(exp*12*25-assets)/Math.max(net*12,1);const html=`<h3 class="text-xl font-bold">สรุปผลการวิเคราะห์</h3><div class="border-b border-zinc-700 py-2">เงินออมต่อเดือน: <span class="text-emerald-400">${net.toLocaleString()} บาท</span></div><div class="border-b border-zinc-700 py-2">สถานะ: ${net>0?'มีกระแสเงินสดบวก':'ติดลบ โปรดตรวจสอบรายจ่าย'}</div><div class="py-2">คาดการณ์เวลาถึงอิสรภาพทางการเงิน: <span class="text-cyan-400 text-2xl">${yearsToFire.toFixed(1)} ปี</span></div>`;document.getElementById('results').innerHTML=html;document.getElementById('copyBtn').classList.remove('hidden');}function copyResult(){const text=document.getElementById('results').innerText;navigator.clipboard.writeText(text);alert('คัดลอกรายงานเรียบร้อยแล้ว!');}</script></body></html>
