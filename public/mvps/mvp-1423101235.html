<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script><title>DebloatFlow | TV Optimizer</title></head><body class="bg-zinc-950 text-zinc-100 min-h-screen p-4 md:p-8"><div class="max-w-4xl mx-auto"><header class="mb-8 flex justify-between items-center"><h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-emerald-400 to-cyan-400">DebloatFlow</h1><a href="https://github.com/Gathin23/cleanyourtv" target="_blank" class="px-3 py-1 bg-zinc-800 rounded-full text-xs hover:bg-zinc-700 transition">GitHub: cleanyourtv</a></header><div class="grid md:grid-cols-3 gap-6"><div class="md:col-span-1 space-y-4"><div class="p-4 bg-zinc-900 rounded-xl border border-zinc-800"><h2 class="text-sm font-semibold mb-3">เลือกโปรไฟล์ทีวี</h2><div class="space-y-2"><button onclick="loadPreset('xiaomi')" class="w-full text-left p-2 bg-zinc-800 rounded hover:bg-zinc-700 text-sm">Xiaomi TV (Mi TV)</button><button onclick="loadPreset('sony')" class="w-full text-left p-2 bg-zinc-800 rounded hover:bg-zinc-700 text-sm">Sony Bravia (Google TV)</button></div></div><div class="p-4 bg-zinc-900 rounded-xl border border-zinc-800"><label class="block text-xs mb-2">Package ลบออก (คั่นด้วยบรรทัดใหม่)</label><textarea id="packages" class="w-full h-32 bg-zinc-950 border border-zinc-700 p-2 text-xs font-mono rounded" placeholder="com.android.partnerbrowsercustomizations..."></textarea></div><button onclick="generateScript()" class="w-full bg-emerald-600 py-2 rounded-lg font-bold hover:bg-emerald-500">สร้างคำสั่ง ADB</button></div><div class="md:col-span-2"><div class="bg-zinc-900 p-6 rounded-xl border border-zinc-800"><div class="flex justify-between items-center mb-4"><h2 class="font-bold">ผลลัพธ์การตั้งค่า</h2><button onclick="copyToClipboard()" class="text-xs text-cyan-400">คัดลอกคำสั่ง</button></div><pre id="output" class="text-xs font-mono bg-black p-4 rounded border border-zinc-800 overflow-x-auto min-h-[200px] text-zinc-400">รอข้อมูลจากคุณ...</pre></div></div></div></div><script>function loadPreset(type) { const p = document.getElementById('packages'); if(type === 'xiaomi') { p.value = 'com.xiaomi.discover\ncom.mitv.tvhome\ncom.xiaomi.mishare.mcast'; } else { p.value = 'com.google.android.apps.tv.launcherx\ncom.sony.dtv.orbtv'; } } function generateScript() { const pkgs = document.getElementById('packages').value.split('\n').filter(Boolean); let script = '# ADB Optimization Script\n'; pkgs.forEach(pkg => { script += `adb shell pm uninstall -k --user 0 ${pkg.trim()}\n`; }); document.getElementById('output').textContent = script; } function copyToClipboard() { const text = document.getElementById('output').textContent; navigator.clipboard.writeText(text); alert('คัดลอกคำสั่งเรียบร้อยแล้ว!'); }</script></body></html>
