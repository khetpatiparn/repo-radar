<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#022c22" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Radar Sweep Gradient -->
    <linearGradient id="radarSweep" x1="50%" y1="50%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="70%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>

  <!-- Dark Base Circle -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)"/>
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#27272a" stroke-width="4"/>

  <!-- Radar Concentric Rings -->
  <circle cx="256" cy="256" r="190" stroke="#064e3b" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>
  <circle cx="256" cy="256" r="140" stroke="#059669" stroke-width="3" opacity="0.6"/>
  <circle cx="256" cy="256" r="85" stroke="#10b981" stroke-width="3.5" opacity="0.8"/>
  <circle cx="256" cy="256" r="30" stroke="#34d399" stroke-width="4" opacity="0.9"/>

  <!-- Crosshair Axis Lines -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#065f46" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.75"/>
  <line x1="50" y1="256" x2="462" y2="256" stroke="#065f46" stroke-width="2.5" stroke-dasharray="6 6" opacity="0.75"/>

  <!-- Diagonal Radar Sweep Slice -->
  <path d="M 256 256 L 390 120 A 190 190 0 0 0 256 66 Z" fill="url(#radarSweep)"/>
  <line x1="256" y1="256" x2="390" y2="120" stroke="#6ee7b7" stroke-width="4" filter="url(#glow)"/>

  <!-- Radar Detection Blips (Trending Repos Detected!) -->
  <circle cx="340" cy="155" r="9" fill="#34d399" filter="url(#glow)"/>
  <circle cx="340" cy="155" r="18" stroke="#34d399" stroke-width="2" opacity="0.5"/>

  <circle cx="170" cy="190" r="6" fill="#10b981" opacity="0.9"/>
  <circle cx="330" cy="330" r="7" fill="#10b981" opacity="0.85"/>
  <circle cx="200" cy="320" r="5" fill="#059669" opacity="0.7"/>

  <!-- Center Pivot Core -->
  <circle cx="256" cy="256" r="12" fill="#34d399" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>

  <!-- Code/Branch Symbol Overlaid at Center (Git Trending Concept) -->
  <g transform="translate(256, 256)">
    <!-- Upward Trend Arrow Pulse -->
    <path d="M -40 -90 L 40 -90 L 0 -130 Z" fill="#34d399" opacity="0.9" filter="url(#glow)"/>
  </g>
</svg>
